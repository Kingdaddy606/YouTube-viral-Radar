
name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android source ZIP
        shell: bash
        run: |
          if [ ! -f "YouTube_Viral_Radar_Source.zip" ]; then
            echo "ERROR: Source ZIP not found in repository root."
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -q YouTube_Viral_Radar_Source.zip -d extracted

          echo "Extracted project files:"
          find extracted -maxdepth 3 -type f | head -50

      - name: Locate Android project
        shell: bash
        run: |
          PROJECT="extracted/YouTube_Viral_Radar_Source"

          if [ ! -f "$PROJECT/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found."
            find extracted -name settings.gradle.kts
            exit 1
          fi

          if [ ! -f "$PROJECT/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: ${{ github.workspace }}/extracted/YouTube_Viral_Radar_Source
        run: gradle --no-daemon :app:assembleDebug

      - name: Run unit tests
        working-directory: ${{ github.workspace }}/extracted/YouTube_Viral_Radar_Source
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: youtube-viral-radar-debug-apk
          path: extracted/YouTube_Viral_Radar_Source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
