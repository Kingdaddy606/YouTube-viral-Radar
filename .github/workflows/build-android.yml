
name: YouTube Viral Radar Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract Android project
        run: |
          if [ ! -f YouTube_Viral_Radar_Source.zip ]; then
            echo "Project ZIP not found in repository root."
            exit 1
          fi

          mkdir -p project
          unzip -q YouTube_Viral_Radar_Source.zip -d project

          if [ ! -f project/YouTube_Viral_Radar_Source/settings.gradle.kts ]; then
            echo "Android project files were not found."
            exit 1
          fi

      - name: Test backend
        working-directory: project/YouTube_Viral_Radar_Source/backend
        run: node --test

      - name: Build debug APK
        working-directory: project/YouTube_Viral_Radar_Source
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Viral-Radar-APK
          path: project/YouTube_Viral_Radar_Source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
